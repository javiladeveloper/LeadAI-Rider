name: Android · Play Store (por tags)

# Se dispara SOLO al crear un tag. El PREFIJO decide a qué canal de Play va:
#   interna-*     → prueba interna  (ej. interna-v0.1.5) — el equipo, en minutos
#   cerrada-*     → prueba cerrada  (ej. cerrada-v0.1.5) — motorizados invitados
#   produccion-*  → PRODUCCIÓN      (ej. produccion-v0.1.5) — publicación COMPLETA
#
# Un push a main NO publica nada: publicar es siempre un acto explícito de
# crear un tag. Escalera recomendada: interna → cerrada → produccion.
#
# El versionCode sale del número de corrida, así que nunca hay que acordarse de
# subirlo ni choca con Play (que rechaza duplicados).
on:
  push:
    tags:
      - "interna-*"
      - "cerrada-*"
      - "produccion-*"
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal de Play Store"
        required: true
        default: "interna"
        type: choice
        options: [interna, cerrada, produccion]

# Una publicación a la vez. NO se cancela la anterior: cortar una subida a
# mitad deja el release a medio crear en Play.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Sin tope, un job colgado corre hasta las 6 HORAS de GitHub y se come
    # la cuota. Un build de Android tarda ~8 min.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determinar canal
        id: canal
        run: |
          if [ -n "${{ github.event.inputs.canal }}" ]; then
            CANAL="${{ github.event.inputs.canal }}"
          else
            case "${GITHUB_REF_NAME}" in
              interna-*)    CANAL="interna" ;;
              cerrada-*)    CANAL="cerrada" ;;
              produccion-*) CANAL="produccion" ;;
              *) echo "::error::El tag '${GITHUB_REF_NAME}' no empieza con interna-, cerrada- ni produccion-"; exit 1 ;;
            esac
          fi
          echo "canal=$CANAL" >> "$GITHUB_OUTPUT"
          echo "Publicando en: $CANAL (tag ${GITHUB_REF_NAME})"

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # El keystore y google-services.json NO viven en el repo: se reconstruyen
      # desde los secretos. Sin google-services.json el plugin no se aplica y la
      # app quedaría sin push ni login con Google.
      - name: Restaurar keystore y google-services
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 — sin él el AAB sale sin firmar y Play lo rechaza."
            exit 1
          fi
          if [ -z "$GOOGLE_SERVICES_BASE64" ]; then
            echo "::error::Falta GOOGLE_SERVICES_JSON_BASE64 — sin él la app se publica SIN push ni login con Google."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > composeApp/release.keystore
          echo "$GOOGLE_SERVICES_BASE64" | base64 -d > composeApp/google-services.json

      # Los tests se saltan en INTERNA, que es el canal de iteracion: los
      # corremos localmente antes de cada tag y ahi los ve quien publica. Son
      # 3 de los 6 minutos del release, y en interna el unico que se expone a
      # un fallo es el propio equipo.
      #
      # En CERRADA y PRODUCCION siguen corriendo: ahi hay motorizados reales
      # trabajando, y la red de seguridad vale los minutos.
      # SIEMPRE, y en un paso propio: el chmod vivia dentro de "Correr los
      # tests", que en interna ahora se saltea — y el AAB fallaba con
      # "./gradlew: Permission denied". Un permiso de archivo no puede depender
      # de que corra un paso opcional.
      - name: Permiso de ejecucion a gradlew
        run: chmod +x ./gradlew

      - name: Correr los tests
        if: steps.canal.outputs.canal != 'interna'
        run: ./gradlew :composeApp:testDebugUnitTest

      # versionCode = número de corrida + offset (lo lee build.gradle.kts).
      - name: Compilar el AAB firmado
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # SIN ESTO EL MAPA SALE EN BLANCO.
          #
          # `build.gradle.kts` la busca en local.properties (que no viaja al
          # repo) y si no la encuentra usa "". En CI no existía ninguna de las
          # dos, así que todo lo publicado salía con la clave vacía: el mapa
          # nativo se veía gris y nadie entendía por qué —en local andaba—.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # Falla RUIDOSAMENTE si falta la clave. Un mapa en blanco en manos
          # de un tester se ve como un bug de la app, no como un secreto sin
          # configurar, y se pierden días buscando en el lugar equivocado.
          if [ -z "$MAPS_API_KEY" ]; then
            echo "::error::Falta el secreto MAPS_API_KEY — sin él el mapa se publica en blanco."
            exit 1
          fi
          ./gradlew :composeApp:bundleRelease

      - name: Instalar Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # La cuenta de servicio va en BASE64: como secret plano, los \n de la
      # private_key se corrompen y Google responde "Invalid JWT Signature".
      - name: Restaurar la clave de Google Play
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_STORE_JSON_KEY_B64 }}
        run: |
          if [ -z "$PLAY_JSON_B64" ]; then
            echo "::error::Falta PLAY_STORE_JSON_KEY_B64 — es la cuenta de servicio que autoriza a subir a Play."
            exit 1
          fi
          echo "$PLAY_JSON_B64" | base64 -d > play-store-key.json

      - name: Subir a Play Store
        env:
          PLAY_STORE_JSON_KEY_PATH: play-store-key.json
          CANAL: ${{ steps.canal.outputs.canal }}
        run: |
          # CERRADA VA COMO BORRADOR mientras la app no se haya publicado.
          #
          # Play rechaza cualquier otro estado sobre una app en borrador:
          # "Only releases with status draft may be created on draft app".
          # El AAB queda cargado en Play Console y se publica a mano desde
          # ahi; una vez que la app salga por primera vez, se quita esta
          # linea y cerrada vuelve a publicar sola.
          #
          # Solo cerrada: interna ya funciona y produccion no debe subir
          # nunca como borrador sin querer.
          if [ "$CANAL" = "cerrada" ]; then
            export PLAY_RELEASE_STATUS=draft
          fi
          case "$CANAL" in
            produccion) bundle exec fastlane android production ;;
            cerrada)    bundle exec fastlane android cerrada ;;
            *)          bundle exec fastlane android interna ;;
          esac

      # Avisa a las apps instaladas que hay una versión nueva. SOLO si la
      # subida a Play salió bien: anunciar una versión que nadie puede instalar
      # es peor que no anunciarla — el usuario ve "actualizá" y en Play no hay
      # nada. (Lección de controlgym, que lo sufrió con un release rechazado.)
      - name: Avisar de la nueva versión
        if: success()
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          if [ -z "$ADMIN_API_KEY" ]; then
            echo "::error::Falta ADMIN_API_KEY — sin él las apps instaladas no se enteran de la actualización."
            exit 1
          fi
          # El OFFSET se LEE de build.gradle.kts en vez de repetirlo acá: con
          # el número escrito a mano en dos lados, cambiar uno y olvidar el
          # otro anuncia una versión que no existe y el aviso nunca aparece.
          # sed y no `grep -P`: en algunos locales el modo Perl no está
          # disponible y devuelve vacío en silencio.
          OFFSET=$(sed -n 's/^val VERSION_CODE_OFFSET = \([0-9]*\).*/\1/p' composeApp/build.gradle.kts)
          if [ -z "$OFFSET" ]; then
            echo "::error::No pude leer VERSION_CODE_OFFSET de build.gradle.kts"
            exit 1
          fi
          VC=$(( ${{ github.run_number }} + OFFSET ))
          # El nombre sale del TAG (interna-v0.1.6 → 0.1.6), igual que en
          # build.gradle.kts: así lo anunciado y lo compilado no divergen.
          VN="${GITHUB_REF_NAME##*-v}"
          [ -n "$VN" ] && [ "$VN" != "$GITHUB_REF_NAME" ] || VN="0.0.0"
          echo "Anunciando versionCode $VC (v$VN)…"
          HTTP=$(curl -s -o /tmp/r.txt -w "%{http_code}" \
            -X POST "https://api.leadai-pe.com/app/version" \
            -H "Content-Type: application/json" \
            -H "x-admin-key: $ADMIN_API_KEY" \
            -d "{\"plataforma\":\"android\",\"versionCode\":$VC,\"versionName\":\"$VN\"}")
          if [ "$HTTP" = "200" ]; then
            echo "OK: las apps instaladas verán el aviso."
          else
            echo "ERROR (HTTP $HTTP):"; cat /tmp/r.txt; exit 1
          fi

      # Se borran aunque el job falle: son la clave de firma y el acceso a Play.
      #
      # `continue-on-error`: si este paso falla, el workflow NO debe quedar en
      # rojo. El runner se destruye completo al terminar, así que borrar los
      # archivos es cinturón sobre tirantes — un fallo acá no significa que la
      # publicación haya salido mal, y marcarlo como error manda un mail que
      # miente sobre el resultado (pasó en la v0.4.2: subió a Play perfecto y
      # el correo decía "All jobs have failed").
      - name: Limpiar secretos del runner
        if: always()
        continue-on-error: true
        run: rm -f composeApp/release.keystore composeApp/google-services.json play-store-key.json
