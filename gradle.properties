org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# iOS: en Windows los targets Apple están deshabilitados (el toolchain de
# Kotlin/Native solo compila iOS en macOS). Este flag silencia el aviso al
# configurar Gradle desde Windows; en una Mac los targets sí compilan
# (Fase D del roadmap).
kotlin.native.ignoreDisabledTargets=true

# Play exige targetSdk 36 desde 2026-08-31. AGP 8.7.3 compila con SDK 36 pero
# avisa que no lo probo; se silencia el aviso (el build y los tests pasan).
android.suppressUnsupportedCompileSdk=36
