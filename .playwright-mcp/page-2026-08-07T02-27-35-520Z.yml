                - generic [ref=f16e291]:
                  - textbox "Descripción completa de la aplicación" [ref=f16e294]: "Light Drive conecta a quien necesita algo con el motorizado que lo puede hacer. En Tacna, al toque. QUÉ PODÉS PEDIR 🚕 Pasajero — que te lleven a donde vas. 🍔 Delivery — que te traigan comida del local que quieras. 📦 Envío — que lleven o traigan un paquete. VOS PONÉS EL PRECIO Acá no hay tarifa impuesta. La app sugiere un monto según la distancia, pero lo podés cambiar: ofrecés lo que te parece justo y lo acordás con el motorizado. El pago es en efectivo, entre ustedes dos. SEGUÍ TU VIAJE Mirá en el mapa dónde viene tu motorizado, en vivo. Escribile por WhatsApp o llamalo si necesitás darle una indicación — el timbre que no anda, el color de la casa, si va con ají o sin ají. MOTORIZADOS VERIFICADOS Antes de tomar carreras, cada motorizado pasa por una verificación de identidad: documento, foto y licencia de conducir, revisados por una persona. ¿SOS MOTORIZADO? La misma app. Tocás \"Quiero manejar\" y empezás a recibir carreras de tu zona. Ves cuánto vas a ganar ANTES de aceptar, sin sorpresas ni descuentos raros. Tus ganancias del día, la semana y el mes, siempre a la vista. Hecho en Tacna."
